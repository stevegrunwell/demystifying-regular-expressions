# Demystifying Regular Expressions

Steve Grunwell <!-- .element: class="byline" -->
[@stevegrunwell@phpc.social](https://phpc.social/@stevegrunwell)
[stevegrunwell.com/slides/regex](https://stevegrunwell.com/slides/regex)
</script></section><section ><section data-markdown><script type="text/template">
## What are regular expressions?

![A Star Wars prequel meme featuring Supreme Chancellor Palpatine with the quote "Regular expressions are a pathway to many abilities some consider to be unnatural"](resources/palpatine.jpg)

<aside class="notes"><p>Regular expressions, at their core, are patterns describing a certain amount of text. We use them for searching, filtering, validation, and so much more.</p>
</aside></script></section><section data-markdown><script type="text/template">
### RegEx or RegExp?

![Dr Cox (John C. McGinnley) from Scrubs pointing to himself and saying "Man not caring", then making a very sarcasticically-apathetic face](resources/man-not-caring.gif)

<aside class="notes"><p>Let&#39;s get this out of the way right out of the gate:</p>
<p>It&#39;s the hottest debate since &quot;gif v jif&quot;: how do we abbreviate and pronounce regular expressions? With the &quot;p&quot; or without? Rej-ex or reg-ex?</p>
<p>The real answer: nobody cares. I&#39;m going to use &quot;regex&quot; throughout, but know that they all mean the same thing.</p>
</aside></script></section><section data-markdown><script type="text/template">
### A brief history of RegEx

* <!-- .element: class="fragment" --> <strong>1951:</strong> Stephen Cole Kleene and "regular events"
* <!-- .element: class="fragment" --> <strong>1968:</strong> Two main uses
    1. Pattern matching in a text editor
    2. Lexical analysis in a compiler
* <!-- .element: class="fragment" --> <strong>1980s:</strong> Perl <3s RegEx
* <!-- .element: class="fragment" --> <strong>1997:</strong> Enter PCRE

<aside class="notes"><p>Far from exhaustive, but a quick history lesson:</p>
<ul>
<li>The concept dates back to 1951, when mathematician Stephen Cole Kleene described &quot;regular languages&quot; via his &quot;regular events&quot; mathematical notation</li>
<li>By 1968, there were two main uses across Unix ecosystem<ul>
<li>First implemented in QED, then later ed; this lead to grep (&quot;Global search for Regular Expression and Print matching lines&quot;, or &quot;Global Regular Expression Print&quot;)</li>
</ul>
</li>
<li>In the 80s, Perl began introducing more powerful features</li>
<li>Beginning 1997, Philip Hazel developed Perl-Compatible Regular Expressions (PCRE), a flavor that has been adopted by many modern programming languages</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">
### Pick your flavor

Two <u>major</u> flavors of regular expressions:

1. <!-- .element: class="fragment" --> Perl-Compatible Regular Expressions ("PCRE")
    * Used in most server-side languages, this talk
2. <!-- .element: class="fragment" --> ECMAScript (JavaScript)

<aside class="notes"><p>There are technically dozens of flavors of regular expressions, but generally speaking you&#39;ll be working with one of these two</p>
<p>The core concepts are the same, but the implementations are slightly different. We don&#39;t get to that level in this talk, but it&#39;s something to be aware of.</p>
<p>Examples in this talk will be based around PCRE.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Who needs Regular Expressions?

* <!-- .element: class="fragment" --> Filtering data
* <!-- .element: class="fragment" --> Data validation
* <!-- .element: class="fragment" --> Scraping content
* <!-- .element: class="fragment" --> <a href="https://www.pcworld.com/article/3104748/claude-code-is-scanning-your-messages-for-curse-words.html">Claude's sentiment analysis, apparently</a>

<aside class="notes"><p>There are a bunch of places where regular expressions are invaluable:</p>
<ul>
<li>Obviously, filtering data and searching for strings. This could be searching in your IDE, filtering lines with grep, etc.</li>
<li>Validating data: if you need to ensure that usernames are between 4 and 32 characters, containing only alphanumeric characters, regex&#39;s got your back!</li>
<li>If you&#39;ve built a web scraper before, you&#39;ve likely need to rely on regular expressions to match patterns in content</li>
<li>In the Claude source code leak, it was revealed that it uses regular expressions to match phrases like &quot;wtf&quot;, &quot;screw this&quot;, and &quot;dumbass&quot; to figure out when it needs to act apologetic</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">
<!-- .slide: data-hide-footer data-background="resources/regexr-phone-number.png" data-background-size="contain" data-background-position="center center" -->

### Debugging Regular Expressions <!-- .element: class="screen-reader-text" -->

<aside class="notes"><p>Before we even get into patterns, I want to draw your attention to regexr.com.</p>
<p>It&#39;s linked to from the my slides&#39; README file and I&#39;ll bring it up again later, but this website has done more to help me learn about regular expressions than anything else: you can drop in a pattern, text you want to match against, and it does a great job of explaining what each part of the expression is looking for.</p>
</aside></script></section></section><section ><section data-markdown><script type="text/template">
## Basic concepts
</script></section><section data-markdown><script type="text/template">
### Understanding the format

<code class="regex-format"><span class="format-delimiter fragment" data-fragment-index="1">/</span><span class="format-pattern fragment" data-fragment-index="2">[A-Z0-9]</span><span class="format-delimiter fragment" data-fragment-index="1">/</span><span class="format-flags fragment" data-fragment-index="3">ig</span></code>

1. <!-- .element: class="fragment" data-fragment-index="1"--> Delimiter (commonly <code>/</code>)
2. <!-- .element: class="fragment" data-fragment-index="2" -->Pattern
3. <!-- .element: class="fragment" data-fragment-index="3" -->Flags

<aside class="notes"><p>When we look at a regular expression, there are three components we&#39;re concerned with:</p>
<ol>
<li>The delimiter, which marks the beginning and end of the pattern. This is usually a forward slash, but it can be anything.</li>
<li>The actual pattern we want to match (in this case, any alphanumeric character)</li>
<li>Any flags to adjust behavior</li>
</ol>
<p>We&#39;ll go further into all of these.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Literal matches

<regex-demo pattern="/guitar/">How much is that <mark>guitar</mark> in the window?</regex-demo>

<aside class="notes"><p>The simplest use of regular expressions is a literal string match: does this string contain the word &quot;guitar&quot;?</p>
<p>In these cases, better off using native language functions like <code>str_contains()</code></p>
</aside></script></section><section data-markdown><script type="text/template">
### The engine returns the leftmost match

<regex-demo pattern="/wood/">How much <mark>wood</mark> would a woodchuck chuck if a woodchuck could chuck wood?</regex-demo>
<regex-demo pattern="/wood/g" class="fragment">How much <mark>wood</mark> would a <mark>wood</mark>chuck chuck if a <mark>wood</mark>chuck could chuck <mark>wood</mark>?</regex-demo>


<aside class="notes"><p>It&#39;s important to understand that by default, regular expressions are designed to find a match and move on; unless you say &quot;give me all of the matches&quot;, it&#39;ll stop at the leftmost match.</p>
<p>We&#39;ll talk more about the global search (&quot;g&quot;) flag later, but for now just think of it as &quot;match all occurrences of this pattern in the string&quot;.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Character classes

<table>
    <thead>
        <tr>
            <th>Class</th>
            <th>Positive</th>
            <th>Negative</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <th scope="row">Digit</th>
            <td><code>\d</code></td>
            <td><code>\D</code></td>
        </tr>
        <tr>
            <th scope="row">Word</th>
            <td><code>\w</code></td>
            <td><code>\W</code></td>
        </tr>
        <tr>
            <th scope="row">Whitespace</th>
            <td><code>\s</code></td>
            <td><code>\S</code></td>
        </tr>
    </tbody>
</table>

<aside class="notes"><p>There are a number of built-in character classes, which are represented by an escape backslash and either a lowercase or uppercase letter.</p>
<p>The lowercase version matches in the affirmative, while the uppercase is in the negative, so lowercase &quot;D&quot; matches a digit while uppercase &quot;D&quot; matches anything that <em>isn&#39;t</em> a digit.</p>
<p>Word, represented by a &quot;W&quot;, matches any alphanumeric characters as well as underscores.</p>
<p>Whitespace, &quot;S&quot;, is any whitespace character: spaces, tabs, etc.</p>
<p>Note that there are a couple more (specifically around Unicode classes) that we won&#39;t be getting into here.</p>
</aside></script></section><section data-markdown><script type="text/template">
#### <u>D</u>igit (`\d`)

Matches any digit, 0–9.

<regex-demo pattern="/\d/g">I <<mark>3</mark> PHP <mark>8</mark>.<mark>5</mark>!</regex-demo>
<regex-demo pattern="/\D/g" class="fragment"><mark>I <</mark>3<mark> PHP </mark>8<mark>.</mark>5<mark>!</mark></regex-demo>

<aside class="notes"><p>The digit character class is probably the easiest, it&#39;s literally any digit from 0–9.</p>
</aside></script></section><section data-markdown><script type="text/template">
#### <u>W</u>ord (`\w`)

Alphanumeric characters and underscores.

<regex-demo pattern="/\w/g"><mark>steve_grunwell_123</mark>@<mark>example</mark>.<mark>com</mark></regex-demo>
<regex-demo pattern="/\W/g" class="fragment">steve_grunwell_123<mark>@</mark>example<mark>.</mark>com</regex-demo>

<aside class="notes"><p>The word character class matches alphanumeric characters and underscores.</p>
<p>Be forewarned that it only matches lower ASCII characters, so accented letters don&#39;t get matched!</p>
</aside></script></section><section data-markdown><script type="text/template">
#### White<u>s</u>pace (`\s`)

Whitespace, including tabs, newlines, etc.

<regex-demo pattern="/\s/g">Gentlemen,<mark> </mark>this<mark> </mark>is<mark> </mark>democracy<mark> </mark>manifest!</regex-demo>
<regex-demo pattern="/\S/g" class="fragment"><mark>Gentlemen,</mark> <mark>this</mark> <mark>is</mark> <mark>democracy</mark> <mark>manifest!</mark></regex-demo>
</script></section><section data-markdown><script type="text/template">
### Character sets

Match specific characters:

<regex-demo pattern="/[Alt]/g"><mark>A</mark> <mark>l</mark>ong <mark>t</mark>ime ago in a ga<mark>l</mark>axy far, far away&hellip;</regex>

<aside class="notes"><p>If we wrap characters in square brackets, we create a character set; only A, l, and t will be selected.</p>
<p>Notice that it&#39;s only the capital A: regex is case-sensitive by default!</p>
</aside></script></section><section data-markdown><script type="text/template">
#### Negating character sets

Match everything *except* those characters:

<regex-demo pattern="/[^Alt]/g">A l<mark>ong </mark>t<mark>ime ago in a ga</mark>l<mark>axy far, far away&hellip;</mark></regex>

<aside class="notes"><p>We can add a caret in our set to negate the pattern, so it selects everything <em>except</em> those characters.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Character ranges

Match anything in a range of letters or numbers:

<regex-demo pattern="/[A-Z0-2]/g"><mark>I</mark>t's as easy as <mark>ABC</mark>, <mark>12</mark>3!</regex-demo>

<aside class="notes"><p>In this example, capture any capital letter (A–Z) and digits between 0 and 2.</p>
<p>These can also be negated in the same way we just saw, with a caret.</p>
</aside></script></section><section data-markdown><script type="text/template">
### The dot character

Match (almost) _any_ character:

<regex-demo pattern="/C.O/g">I got in trouble with the <mark>CEO</mark>, <mark>CFO</mark>, <mark>CTO</mark>, and <mark>CIO</mark> for my comments</regex-demo>

<aside class="notes"><p>The dot character matches anything except for newlines and carriage returns.</p>
<p>You&#39;ll see these come up a lot once we get into quantifiers.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Escaping

Use a backslash (`\`) to escape special characters:

<regex-demo pattern="/example.com/g"><mark>example.com</mark>, <mark>example2com</mark>munity.com</regex-demo>
<regex-demo pattern="/example\.com/g" class="fragment"><mark>example.com</mark>, example2community.com</regex-demo>

<aside class="notes"><p>As we get further into regular expressions, you&#39;ll find that there are a number of reserved characters, which we then have to escape if we want to include them in our patterns.</p>
<p>In this case, we didn&#39;t escape the dot in the pattern, so while it <em>can</em> match a literal dot character, it can also match any other character, too.</p>
<p>Adding a backslash in our pattern tells the engine that we&#39;re looking for a literal dot character.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Quantifiers

<table>
    <thead>
        <tr>
            <th>Symbol</th>
            <th>Meaning</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <th scope="row"><code>*</code></th>
            <td>Zero or more</td>
        </tr>
        <tr>
            <th scope="row"><code>+</code></th>
            <td>One or more</td>
        </tr>
        <tr>
            <th scope="row"><code>?</code></th>
            <td>Zero or one</td>
        </tr>
        <tr>
            <th scope="row"><code>{x}</code></th>
            <td>Exactly x</td>
        </tr>
        <tr>
            <th scope="row"><code>{x,y}</code></th>
            <td>Between x and y</td>
        </tr>
        <tr>
            <th scope="row"><code>{x,}</code></th>
            <td>x or more</td>
        </tr>
    </tbody>
</table>

<aside class="notes"><p>We use quantifiers to tell the engine how many times we&#39;re expecting to see a particular pattern (or sub-pattern) match.</p>
<p>We&#39;ll go through each of these, but it can be useful to see them all together:</p>
<ul>
<li>The first three are the most-broad: zero or more, one or more, and zero or one.</li>
<li>The latter three give us more control: we expect to see exactly X, between X and Y, or <em>at least</em> X</li>
</ul>
</aside></script></section><section data-markdown><script type="text/template">
#### Zero, one, or more

Zero or more capital letters at the start:

<regex-demo pattern="/[A-Z]*\w+/g"><mark>Hello</mark>, <mark>world</mark>!</regex-demo>

At least one capital letter at the start: <!-- .element: class="fragment" data-fragment-index="1" -->

<regex-demo pattern="/[A-Z]+\w+/g" class="fragment" data-fragment-index="1"><mark>Hello</mark>, world!</regex-demo>

<aside class="notes"><p>Here, we&#39;re specifying that we&#39;re looking for zero or more capital letters, followed by at least one word character (which could be any letter).</p>
<p>If we change the asterisk after the character range to a plus sign, that tells the engine that we <em>only</em> want to match words that start with capital letters.</p>
</aside></script></section><section data-markdown><script type="text/template">
#### Zero or one

Words with begin with zero or one capital letter:

<regex-demo pattern="/[A-Z]?[a-z]+/g"><mark>Ready</mark>, <mark>set</mark>, GO!</regex-demo>

<aside class="notes"><p>In this case, we&#39;re looking for words that are either entirely lowercase or start with <em>one</em> capital letter.</p>
</aside></script></section><section data-markdown><script type="text/template">
#### Specific number

Four letter words:

<regex-demo pattern="/\w{4}/g"><mark>What</mark> is the charge? Eating a <mark>meal</mark>? A succulent Chinese <mark>meal</mark>?</regex-demo>
</script></section><section data-markdown><script type="text/template">
#### Specified range

Words with 2–4 letters:

<regex-demo pattern="/\w{2,4}/g"><mark>What</mark> <mark>is</mark> <mark>the</mark> charge? Eating a <mark>meal</mark>? A succulent Chinese <mark>meal</mark>?</regex-demo>
</script></section><section data-markdown><script type="text/template">
#### At least a certain number

Words with at least 5 letters:

<regex-demo pattern="/\w{5,}/g">What is the <mark>charge</mark>? <mark>Eating</mark> a meal? A <mark>succulent</mark> <mark>Chinese</mark> meal?</regex-demo>

<aside class="notes"><p>In this example, we&#39;re finding any words with at least five characters.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Anchors

<table>
    <thead>
        <tr>
            <th>Symbol</th>
            <th>Meaning</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <th scope="row"><code>^</code></th>
            <td>Beginning of string</td>
        </tr>
        <tr>
            <th scope="row"><code>$</code></th>
            <td>End of string</td>
        </tr>
        <tr>
            <th scope="row"><code>\b</code></th>
            <td>Word boundary</td>
        </tr>
        <tr>
            <th scope="row"><code>\B</code></th>
            <td><u>Not</u> word boundary</td>
        </tr>
    </tbody>
</table>

<aside class="notes"><p>Like with quantifiers, we have anchors to help modify our patterns.</p>
<p>The first two are certainly the most common: a caret to indicate the beginning of a string, and a dollar sign to indicate the end</p>
<p>You&#39;re less likely to see the word boundary anchors, but we&#39;ll talk about them as well.</p>
</aside></script></section><section data-markdown><script type="text/template">
#### Start of string (`^`)

<regex-demo pattern="/[A-Z].+/">3. <mark>Profit!</mark></regex-demo>
<regex-demo pattern="/^[A-Z].+/" class="fragment">3. Profit!</regex-demo>

<aside class="notes"><p>If we start our pattern with a caret, that means &quot;start evaluating this from the start of a string&quot;—if there&#39;s extra whitespace, other characters, etc. then our pattern won&#39;t match.</p>
<p>Be aware that this is the <em>second</em> use of the caret we&#39;ve seen: don&#39;t confuse this for negating a character set!</p>
</aside></script></section><section data-markdown><script type="text/template">
#### End of string (`$`)

<regex-demo pattern="/over/g">I'm <mark>over</mark> ending messages in "<mark>over</mark>", <mark>over</mark></regex-demo>
<regex-demo pattern="/over$/g" class="fragment">I'm over ending messages in "over", <mark>over</mark></regex-demo>

<aside class="notes"><p>Similarly, the dollar sign represents the end of a string.</p>
<p>In this case, adding the dollar sign ensures we only match the last &quot;over&quot; (but if we added punctuation to the sentence, the pattern would cease to match)</p>
<p>Keep in mind that this is matching the entire input string, which is not necessarily a single line. We&#39;ll talk about this more when we get to flags in a moment.</p>
</aside></script></section><section data-markdown><script type="text/template">
#### Word boundaries

<regex-demo pattern="/\bart/g">Start making <mark>art</mark> from the heart</regex-demo>
<regex-demo pattern="/\Bart/g">St<mark>art</mark> making art from the he<mark>art</mark></regex-demo>

<aside class="notes"><p>The would boundary anchors are related to the <code>\w</code> character class we discussed earlier; we can use this to say &quot;only match this pattern if it starts and/or ends with a word boundary&quot;</p>
<p>We can also use it to say &quot;only match if the word <em>doesn&#39;t</em> start or finish with a word boundary&quot;</p>
</aside></script></section><section data-markdown><script type="text/template">
### Flags

<table>
    <thead>
        <tr>
            <th>Flag</th>
            <th>Meaning</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <th scope="row"><code>i</code></th>
            <td>Ignore case</td>
        </tr>
        <tr>
            <th scope="row"><code>m</code></th>
            <td>Multi-line</td>
        </tr>
        <tr>
            <th scope="row"><code>s</code></th>
            <td>Dot matches all characters</td>
        </tr>
        <tr>
            <th scope="row"><code>g</code></th>
            <td>Global search</td>
        </tr>
    </tbody>
</table>

<aside class="notes"><p>This list isn&#39;t exhaustive, but these are the four flags you&#39;re most likely to run into.</p>
</aside></script></section><section data-markdown><script type="text/template">
#### Case-insensitive (`i`)

<regex-demo pattern="/fine/">tHiS iS fInE</regex-demo>
<regex-demo pattern="/fine/i" class="fragment">tHiS iS <mark>fInE</mark></regex-demo>

<aside class="notes"><p>The case-insensitive (&quot;i&quot;) flag is probably the most common one you&#39;ll see.</p>
</aside></script></section><section data-markdown><script type="text/template">
#### Mutli-line (`m`)

<regex-demo pattern="/^\*.+/g"><mark>* Buy groceries</mark><br>* Pick up prescriptions</regex-demo>
<regex-demo pattern="/^\*.+/gm" class="fragment"><mark>* Buy groceries</mark><br><mark>* Pick up prescriptions</mark></regex-demo>

<aside class="notes"><p>The multi-line (&quot;m&quot;) flag changes the way the caret and dollar-sign anchors work: instead of the beginning/end of the entire string, it treats the anchors as the beginning or end (respectively) of a <em>line</em></p>
<p>In this case, each line that starts with an asterisk gets matched.</p>
<p>Also, note that we had to escape the asterisk: otherwise it would match zero or more start-of-line positions, which could be a subtle bug!</p>
</aside></script></section><section data-markdown><script type="text/template">
#### Dot-all (`s`)

<regex-demo pattern="/world.+fine/">It's the end of the world as we know it,<code style="padding-left: 1em; font-size: .86em; opacity: 0.4">¶</code><br> and I feel fine</regex-demo>
<regex-demo pattern="/world.+fine/s" class="fragment">It's the end of the <mark>world as we know it,<code style="padding-left: 1em; font-size: .86em; opacity: 0.4">¶</code><br> and I feel fine</mark></regex-demo>

<aside class="notes"><p>As you may recall, the dot character normally matches everything <em>except</em> newline and carriage returns. The dot-all (&quot;s&quot;) flag changes this behavior so it matches <em>anything</em>.</p>
</aside></script></section><section data-markdown><script type="text/template">
#### Global search (`g`)

<regex-demo pattern="/duck/">Let's play <mark>duck</mark>, duck, goose!</regex-demo>
<regex-demo pattern="/duck/g" class="fragment">Let's play <mark>duck</mark>, <mark>duck</mark>, goose!</regex-demo>

<aside class="notes"><p>As I mentioned earlier, the global search (&quot;g&quot;) flag basically says &quot;match all occurrences of this pattern&quot;; without it, only the first match will be found.</p>
<p>Be aware that functions built into languages will often have different functions designed to return multiple matches (e.g. <code>preg_match()</code> and <code>preg_match_all()</code> in PHP, <code>String.match()</code> and <code>String.matchAll()</code> in JavaScript)</p>
</aside></script></section><section data-markdown><script type="text/template">
### Capture groups

<regex-demo pattern="/(\w+) has joined/g"><mark>Ben</mark> has joined<br><mark>Alena</mark> has joined</regex-demo>

<aside class="notes"><p>Capture groups let us specify portions of a string that we wish to extract. In this case, we&#39;re matching any word followed by &quot;has joined&quot;.</p>
<p>So not only do we want to match &quot;name has joined&quot;, but also capture the $name portion as part of a capture group. We do this by wrapping the group in parentheses.</p>
</aside></script></section><section data-markdown><script type="text/template">
#### Capture groups in PHP

```php
$activity = 'Ben has joined. Alena has joined.';
preg_match_all('/(\w+) has joined/', $activity, $matches);
print_r($matches);
```

```php[|2-6|8-12]
Array(
    [0] => Array
        (
            [0] => Ben has joined
            [1] => Alena has joined
        )

    [1] => Array
        (
            [0] => Ben
            [1] => Alena
        )
)
```
<!-- .element: class="fragment hide-line-numbers" -->

<aside class="notes"><p>If we take that pattern and use it with PHP&#39;s <code>preg_match_all()</code> function, we populate a <code>$matches</code> array that looks like this:</p>
<ol>
<li>The first array is all of the matched strings (e.g. &quot;Ben has joined&quot;)</li>
<li>The second array (key of 1) represents the first capture group (e.g. &quot;Ben&quot;, &quot;Alena&quot;)</li>
</ol>
<p>If we had multiple capture groups, we&#39;d see additional arrays for capture groups 2, 3, etc.</p>
</aside></script></section><section data-markdown><script type="text/template">
#### Replacing with capture groups

```php[|4]
$activity = 'Ben has joined. Alena has joined.';
echo preg_replace(
    '/(\w+) has joined/',
    '\1 is cool',
    $activity
);
```
<!-- .element: class="hide-line-numbers" -->

```text
Ben is cool. Alena is cool.
```
<!-- .element: class="fragment" -->

<aside class="notes"><p>Thanks to capture groups, we can also reference these values when we do replacements.</p>
<p>In this case, we use a backslash and number 1 to reference the value of the first matching group.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Non-capturing groups

<regex-demo pattern="(\w+) plays (?:basket|foot)ball/g"><mark>LeBron plays basketball</mark>. <mark>Travis plays football</mark>. Sammy plays baseball.</regex-demo>

<aside class="notes"><p>Parentheses can also be used to group conditions in what is referred to as a &quot;non-capturing group&quot;. We indicate this with <code>?:</code> after the opening paren.</p>
<p>In this case, we&#39;re matching a name and a sport, which starts with either &quot;basket&quot; or &quot;foot&quot; and ends in &quot;ball&quot;. However, if we were to inspect our $matches array from something like <code>preg_match_all()</code>, we won&#39;t see a capture group with values &quot;basket&quot; and &quot;foot&quot;.</p>
<p>If it helps, think of non-capturing groups as parentheses like you&#39;d use to group operations together, just with the <code>?:</code> at the start.</p>
<p>This is also the first time we&#39;re seeing the &quot;pipe&quot; character, which acts as a literal &quot;or&quot;. However, it&#39;s usefulness is usually limited unless it&#39;s within parentheses: in this case, match &quot;basket&quot; <em>or</em> &quot;foot&quot;, followed by ball.</p>
</aside></script></section></section><section ><section data-markdown><script type="text/template">
## Advanced topics

<aside class="notes"><p>We&#39;ve covered a lot of the basics so far, but regular expressions go so much deeper.</p>
<p>I&#39;ll briefly touch on a few advanced topics, but going much deeper will be an exercise for the viewer.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Looking ahead

Positive lookahead (`?=`):
<regex-demo pattern="/\d+(?=\w+)/g">0 <mark>15</mark>px <mark>2</mark>em</regex-demo>
<!-- .element: class="fragment" -->

Negative lookahead (`?!`):
<regex-demo pattern="/\d+(?!\w+)/g"><mark>0</mark> 15px 2em</regex-demo>
<!-- .element: class="fragment" -->

<aside class="notes"><p>Regular Expressions&#39; lookaround capabilities allow you to examine the areas before or after your match.</p>
<p>Lookahead will look after the match and may discard the match if the lookahead expectations are not met.</p>
<p>In this case, match one or more digits that are immediately followed by at least one word character: we want the numbers with a unit, but don&#39;t care about zero.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Looking behind

Positive lookbehind (`?<=`):
<regex-demo pattern="/(?<=\$)\d+/g">He paid $<mark>24</mark> for 3 coffees</regex-demo>
<!-- .element: class="fragment"-->

Negative lookbehind (`?<!`):
<regex-demo pattern="/(?<!\$)\d+/g">He paid $2<mark>4</mark> for <mark>3</mark> coffees</regex-demo>
<!-- .element: class="fragment"-->

<aside class="notes"><p>Lookbehinds are very similar, but we put a less-than (<code>&lt;</code>) sign after the question marks.</p>
<p>In this case, find one or more digits that are immediately preceded by a dollar sign.</p>
<p>For the negative lookbehind, note that we&#39;re capturing the &quot;4&quot; in 24, since that digit is not immediately preceded by a dollar sign.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Lazy v Greedy

Greedy (default):
<regex-demo pattern="/ba(?:na)+/"><mark>bananananana</mark></regex-demo>
<!-- .element: class="fragment" -->

Lazy:
<regex-demo pattern="/ba(?:na)+?/"><mark>bana</mark>nananana</regex-demo>
<!-- .element: class="fragment" -->

<aside class="notes"><p>By default, regular expression quantifiers will match as many instances as it can: &quot;Ba&quot; followed by five &quot;na&quot;s</p>
<p>If we add a question mark after the quantifier, this tells the engine to be lazy (&quot;ungreedy&quot;); in this case, stop matching after the first group of &quot;na&quot; in &quot;bananananana&quot;.</p>
</aside></script></section></section><section ><section data-markdown><script type="text/template">
## Common patterns

<aside class="notes"><p>Now that we have a good understanding of what regular expressions are capable of, let&#39;s look at some practical applications:</p>
</aside></script></section><section data-markdown><script type="text/template">
### Grepping logs

```sh
tail -f access.log | grep -Eio '[a-z0-9-]+bot\/[0-9\.]+'
```

```text
Amzn-SearchBot/0.1
SemrushBot/7
Claude-SearchBot/1.0
Googlebot/2.1
ClaudeBot/1.0
bingbot/2.0
DuckAssistBot/1.2
```
<!-- .element: class="fragment" -->

<aside class="notes"><p>A common place where we&#39;ll use regular expressions are to search through logs.</p>
<p>In this example, we&#39;re looking for any combination of letters, numbers, and dashes that end in &quot;bot&quot;, followed by a forward slash and something that looks like a version number.</p>
<p>The <code>-E</code> tells grep that we&#39;re using extended regular expressions, the <code>-i</code> is making the search case-insensitive (grep doesn&#39;t use flags in the same way), and <code>-o</code> filters the result to only the matched substring</p>
<p>We can use this to get a sense of which bots are hitting our server.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Validating user input

```php
$pattern = '/[a-z][a-z0-9_]{1,31}/i';

if (!preg_match($pattern, $username)) {
    throw new ValidationException('Username is invalid!');
}
```

<aside class="notes"><p>If you don&#39;t have a more-sophisticated library for validating user input, you might do something like this to validate a username.</p>
<p>In this case, we&#39;re matching a string that&#39;s between 2 and 32 characters that starts with a letter and contains only letters, numbers, and underscores.</p>
<p>If the provided username doesn&#39;t match, we&#39;ll throw a ValidationException.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Sanitize page slugs

<pre class="progressive-reveal hljs php language-php"><code>$title = "10 Things They Don't Want You to Know!";</code><code class="fragment" data-fragment-index="0">
// Replace whitespace with hyphens
$title = str_replace(' ', '-', strtolower($title));</code><code class="fragment" data-fragment-index="1">
// Alphanumeric or GTFO
$title = preg_replace('/[^a-z0-9-]/i', '', $title);</code></pre>

<pre><code class="hljs plaintext fragment fade-out" data-fragment-index="0">10 Things They Don't Want You to Know!</code><code class="hljs plaintext fragment fade-in-out" data-fragment-index="0">10-things-they-don't-want-you-to-know!</code><code class="hljs plaintext fragment" data-fragment-index="1">10-things-they-dont-want-you-to-know</code></pre>

<aside class="notes"><p>Here&#39;s a simple replacement I&#39;ve written a dozen times: taking a string and creating a URL-friendly version.</p>
<p>First, we&#39;ll convert any spaces to hyphens; this is a simple match, so we can use a simple <code>str_replace()</code></p>
<p>Next, we&#39;ll replace anything <em>except</em> for alphanumeric characters and hyphens with an empty string. This leaves us with a pretty slug, free of punctuation or other special characters.</p>
</aside></script></section></section><section ><section data-markdown><script type="text/template">
## Using RegEx effectively

<aside class="notes"><p>Now that you have a good understanding of how regular expressions work and what you can do with them, let&#39;s wrap up by talking about how to use them effectively.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Just because you _can_&hellip;

![Jeff Goldblum's character from Jurassic Park (1993) with the caption "You were so preoccupied with whether or not you could you didn't stop to think if should"](resources/could-should.jpg)

<aside class="notes"><p>Regular expressions are extremely powerful, but sometimes it&#39;s easy to forget that they&#39;re but one tool in our toolbox. If you find yourself reaching for regular expressions for things like parsing markup it&#39;s worth pausing and seeing if there are better tools for the job.</p>
</aside></script></section><section data-markdown><script type="text/template">
#### Validating an email?

```php
// Some incomplete regex for an email address
$pattern = '[a-z0-9-_]@[a-z09-](\.[a-z]{2,})+';

if (!preg_match($pattern, $email)) {
    throw new ValidationException('Invalid email!');
}
```
<!-- .element: class="fragment shrink" data-fragment-index="0" -->

![Vizzini (Wallace Shawn) from The Princess Bride (1987) exclaiming "You fell victim to one of the classic blunders!"](resources/classic-blunders.gif) <!-- .element: class="fragment fade-up" data-fragment-index="0" style="margin: 0;" -->

<aside class="notes"><p>One of the first places where people hear about regular expressions are for validating things like email addresses, URLs, etc.</p>
<p>Unfortunately, most examples are incomplete and catch only the most typical patterns.</p>
<p>However, if you&#39;re working with PHP, there are better ways!</p>
</aside></script></section><section data-markdown><script type="text/template">
#### PHP's filter_var() function

```php[1-3|5-7|9-11]
if (!filter_var($email, FILTER_VALIDATE_EMAIL)) {
    throw new ValidationException('Invalid email!');
}

if (!filter_var($url, FILTER_VALIDATE_URL)) {
    throw new ValidationException('Invalid URL!');
}

if (!filter_var($ip, FILTER_VALIDATE_IP)) {
    throw new ValidationException('Invalid IP address!');
}
```
<!-- .element: class="hide-line-numbers" -->

<aside class="notes"><p>PHP&#39;s <code>filter_var()</code> function has a bunch of built-in patterns for validating things like email addresses, URLs, domains, IP addresses, MAC addresses, and more.</p>
<p>Before you go trying to write a regular expression, check to see what&#39;s already available.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Alternative delimiters

<pre class="fragment-replacement"><code class="hljs php language-php fragment fade-out" data-fragment-index="0">$pattern = '/https?:\/\/\w+\.\w{2,}\/?/i';</code><code class="hljs php language-php fragment fade-in" data-fragment-index="0">$pattern = '@https?://\w+\.\w{2,}/?@i';</code></pre>

Common: `@`, `#`, `~`, `%`
<!-- .element: class="fragment" data-fragment-index="1" -->

<aside class="notes"><p>Earlier, I mentioned that we can technically use almost any character as a delimiter. The most common character is the forward slash, but that can get messy when dealing with things like filepaths, as you have to escape the delimiter character within a pattern.</p>
<p>Common alternatives include the &quot;at-sign&quot;, octothorpe (pound-sign), tilde, and percent sign.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Comment your patterns!

Not everyone's a RegExpert like you 😉

```php
/*
 * Match domain names containing at least 5 characters
 * with TLDs .com, .org, or .net (case-insensitive).
 */
$pattern = '/\w{5,}\.(com|org|net)/i';
```

<aside class="notes"><p>While there are ways to add comments within regex patterns, it&#39;s just as easy to put a comment before any regular expression.</p>
<p>Eric Mann dinged me on a code review for this in like 2015, and I&#39;ve been documenting them ever since.</p>
</aside></script></section><section data-markdown><script type="text/template">
### Escaping input strings

<pre class="fragment-replacement overflow-hidden"><code class="hljs php language-php fragment fade-out" data-fragment-index="0">$bands = ['N*SYNC', 'AC/DC', 'Portugal. The Man'];
$pattern = sprintf(
    '/Artist: (%s)/i',
    implode('|', $bands)
);</code><code class="hljs php language-php fragment fade-in" data-fragment-index="0">$bands = ['N*SYNC', 'AC/DC', 'Portugal. The Man'];
$bands = array_map(fn ($b) => preg_quote($b, '/'), $bands);
$pattern = sprintf(
    '/Artist: (%s)/i',
    implode('|', $bands)
);</code></pre>

<pre class="fragment-replace hljs plaintext"><code class="fragment fade-out" data-fragment-index="0">/Artist: (N*SYNC|AC/DC|Portugal. The Man)/i</code><code class="fragment fade-in" data-fragment-index="0">/Artist: (N\*SYNC|AC\/DC|Portugal\. The Man)/i</code></pre>

<aside class="notes"><p>If you&#39;re dynamically constructing regular expressions, be aware of where the input is coming from.</p>
<p>In PHP, we have the <code>preg_quote()</code> function, which escapes characters that are part of the regular expression syntax. Without it, bands like these would break our artist search.</p>
</aside></script></section></section><section ><section data-markdown><script type="text/template">
## RegEx isn't magic

> Any sufficiently advanced technology is indistinguishable from magic. <cite>Arthur C. Clarke</cite>

<aside class="notes"><p>Hopefully this talk has been enlightening for you, but remember that regular expressions are not magic. Just like anything else related to computers, they can be learned and harnessed to do amazing (or heinous things).</p>
<p>British sci-fi author Arthur C. Clarke</p>
</aside></script></section><section data-markdown><script type="text/template">
